# =============================================================================
#  docker-compose.yml — UltraJurnal.bot
#  Discord PDF Converter Bot
# =============================================================================

services:
  ultrajurnal-bot:
    # ── Build dari Dockerfile di direktori ini ──────────────────────────────
    build:
      context: .
      dockerfile: Dockerfile

    # ── Nama container ──────────────────────────────────────────────────────
    container_name: ultrajurnal-bot

    # ── Restart otomatis ────────────────────────────────────────────────────
    # unless-stopped : restart kecuali jika di-stop manual
    restart: unless-stopped

    # ── Environment variables dari file .env ────────────────────────────────
    env_file:
      - .env

    # ── Volume: folder output hasil konversi ────────────────────────────────
    volumes:
      - ./Hasil:/app/Hasil

    # ── Logging: simpan log dengan ukuran terbatas ──────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
