[project]
name = "pdf-converter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "camelot-py",
    "openpyxl",
    "pandas",
    # Discord bot
    "discord.py>=2.3",
    "python-dotenv",
    "aiohttp",
    # Google Drive
    "google-api-python-client",
    "google-auth",
    "google-auth-httplib2",
]

[project.scripts]
converter    = "converter:main"
discord-bot  = "discord_bot:main"
